name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # After `npm ci` (which recreates node_modules): reuse the MongoDB binary
      # that mongodb-memory-server downloads for the API tests.
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-memory-server-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: npm test
