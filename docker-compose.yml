# Full stack locally (or on a single VPS): MongoDB + EduTrack.
#   cp .env.docker.example .env.docker   # then edit the secrets
#   docker compose --env-file .env.docker up --build
# Open http://localhost:4000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/edutrack
      APP_URL: ${APP_URL:-http://localhost:4000}
      CLIENT_ORIGIN: ${APP_URL:-http://localhost:4000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env.docker}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env.docker}
      # Plain-HTTP localhost: allow the refresh cookie without HTTPS. Remove behind HTTPS.
      COOKIE_SECURE: "false"
      # First admin is created on boot only if no admin exists yet.
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-System Admin}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      ALLOW_STUDENT_SIGNUP: ${ALLOW_STUDENT_SIGNUP:-true}
      DEMO_MODE: ${DEMO_MODE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-EduTrack <no-reply@localhost>}
    volumes:
      - uploads:/data/uploads

volumes:
  mongo-data:
  uploads:
